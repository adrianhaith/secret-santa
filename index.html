<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f34">
  <meta name="referrer" content="no-referrer">
  <title>Family Secret Santa</title>
  <link rel="icon" href="assets/gift.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="snow" aria-hidden="true">✦ · ❅ · ✧ · ❅ · ✦</div>
  <header><span class="brand">✦ A little Christmas magic</span><button id="music" class="quiet" aria-label="Turn music on">♫ Music: Off</button></header>
  <p id="audio-status" class="audio-status" role="status"></p>
  <div id="practice" class="practice" hidden>PRACTICE DRAW · Just for fun</div>
  <main id="app" tabindex="-1"></main>
  <footer>Made for giving. Meant to stay secret.<details id="settings"><summary>Draw settings</summary><button id="reset" class="quiet">Reset for a new draw</button></details></footer>
  <dialog id="confirm"><h2 id="confirm-title"></h2><p id="confirm-text"></p><label id="erase-label" hidden>Type RESET to erase this draw<input id="erase-input" autocomplete="off" spellcheck="false"></label><div class="actions"><button id="cancel" class="secondary">Cancel</button><button id="accept">Continue</button></div></dialog>
</body>
</html>
